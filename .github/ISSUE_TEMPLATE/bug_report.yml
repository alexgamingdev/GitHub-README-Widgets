name: Bug report
description: Report a reproducible problem with the extension.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search for an existing report. Do not include credentials, private webhook URLs, or personal data.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Firefox 128"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example if possible. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
